name: ragflow-psr-m05
services:
  ragflow-cpu:
    platform: linux/amd64
    ports: !override
      - "127.0.0.1:${SVR_WEB_HTTP_PORT}:80"
      - "127.0.0.1:${SVR_WEB_HTTPS_PORT}:443"
      - "127.0.0.1:${SVR_HTTP_PORT}:9380"
      - "127.0.0.1:${ADMIN_SVR_HTTP_PORT}:9381"
      - "127.0.0.1:${SVR_MCP_PORT}:9382"
    mem_limit: 8589934592
    cpus: 3.0
    restart: unless-stopped
    environment:
      - COMPOSE_PROFILES=infinity,cpu,metadata-mysql,tei-cpu
      - TEI_MODEL=BAAI/bge-small-en-v1.5
  infinity:
    image: infiniflow/infinity:v0.7.4-x64-v3
    platform: linux/amd64
    ports: !override
      - "127.0.0.1:${INFINITY_THRIFT_PORT}:23817"
      - "127.0.0.1:${INFINITY_HTTP_PORT}:23820"
      - "127.0.0.1:${INFINITY_PSQL_PORT}:5432"
    volumes:
      - ../psr/runtime/bre-200/infinity_conf.psr.toml:/infinity_conf.toml:ro
    mem_limit: 2147483648
    cpus: 1.5
  mysql:
    ports: !override
      - "127.0.0.1:${EXPOSE_MYSQL_PORT}:3306"
    mem_limit: 1610612736
    cpus: 1.0
    command:
      - --max_connections=400
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --tls_version=TLSv1.2,TLSv1.3
      - --init-file=/data/application/init.sql
      - --binlog_expire_logs_seconds=604800
      - --innodb-flush-log-at-trx-commit=1
      - --sync-binlog=1
      - --innodb-buffer-pool-size=512M
      - --innodb-io-capacity=1000
      - --innodb-io-capacity-max=2000
      - --innodb-redo-log-capacity=512M
  redis:
    ports: !override
      - "127.0.0.1:${REDIS_PORT}:6379"
    mem_limit: 512m
    cpus: 0.5
  minio:
    ports: !override
      - "127.0.0.1:${MINIO_PORT}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT}:9001"
    mem_limit: 512m
    cpus: 0.5
  tei-cpu:
    platform: linux/amd64
    ports: !override
      - "127.0.0.1:${TEI_PORT}:80"
    command: ["--model-id", "${TEI_MODEL}", "--auto-truncate"]
    mem_limit: 2147483648
    cpus: 2.0

  es01:
    ports: !override
      - "127.0.0.1:${ES_PORT}:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - ES_JAVA_OPTS=-Xms768m -Xmx768m
      - cluster.routing.allocation.disk.watermark.low=5gb
      - cluster.routing.allocation.disk.watermark.high=3gb
      - cluster.routing.allocation.disk.watermark.flood_stage=2gb
    mem_limit: 1610612736
    cpus: 1.5
